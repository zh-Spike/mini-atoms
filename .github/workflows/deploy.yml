name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to deploy (empty = latest main). Use an older SHA to roll back.
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zh-spike/mini-atoms
  APP_DIR: /opt/mini-atoms

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName ${{ vars.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Deploy to server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp docker-compose.yml prod:${APP_DIR}/docker-compose.yml
          echo "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh prod "cd ${APP_DIR} \
            && IMAGE_TAG=${IMAGE_TAG} docker compose pull \
            && IMAGE_TAG=${IMAGE_TAG} docker compose up -d --remove-orphans \
            && docker logout ghcr.io \
            && docker image prune -f"

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "http://${{ vars.DEPLOY_HOST }}/healthz"; then
              echo; echo "Deployed ${IMAGE_TAG}"; exit 0
            fi
            sleep 3
          done
          echo "Health check failed"; ssh prod "cd ${APP_DIR} && docker compose ps && docker compose logs --tail 50"
          exit 1
