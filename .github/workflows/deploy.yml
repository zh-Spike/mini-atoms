name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to deploy (empty = latest main). Use an older SHA to roll back.
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zh-spike/mini-atoms
  APP_DIR: /opt/mini-atoms

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://${{ vars.SITE_ADDRESS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Only deploy commits merged into main
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$(git rev-parse HEAD) is not on main; refusing to deploy"; exit 1; }

      - name: Resolve image tag
        run: echo "IMAGE_TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: |
            GIT_SHA=${{ env.IMAGE_TAG }}
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host prod
            HostName ${{ vars.DEPLOY_HOST }}
            User ${{ secrets.DEPLOY_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Upload runtime config
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          INVITE_CODES: ${{ secrets.INVITE_CODES }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          SITE_ADDRESS: ${{ vars.SITE_ADDRESS }}
          ADMIN_USERNAMES: ${{ vars.ADMIN_USERNAMES }}
        run: |
          KEYS="DATABASE_URL LLM_API_KEY SECRET_KEY INVITE_CODES LLM_BASE_URL LLM_MODEL SITE_ADDRESS"
          OPTIONAL="ADMIN_USERNAMES"
          for k in $KEYS; do
            [ -n "${!k}" ] || { echo "::error::Missing production config: $k"; exit 1; }
          done
          for k in $KEYS $OPTIONAL; do printf '%s=%s\n' "$k" "${!k}"; done \
            | ssh prod "umask 077 && cat > ${APP_DIR}/.env.new && mv ${APP_DIR}/.env.new ${APP_DIR}/.env"

      - name: Deploy to server
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp docker-compose.yml Caddyfile prod:${APP_DIR}/
          echo "$GHCR_TOKEN" | ssh prod "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh prod "cd ${APP_DIR} \
            && IMAGE_TAG=${IMAGE_TAG} docker compose pull \
            && IMAGE_TAG=${IMAGE_TAG} docker compose up -d --remove-orphans \
            && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
            && docker logout ghcr.io \
            && docker image prune -f"

      - name: Health check
        env:
          BASE: https://${{ vars.SITE_ADDRESS }}
        run: |
          check() {
            curl -fsS --max-time 5 "$BASE/healthz" >/dev/null \
              && curl -fsS --max-time 5 "$BASE/" | grep -q '<div id="root">' \
              && [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$BASE/api/auth/me")" = 401 ] \
              && curl -fsS --max-time 10 "$BASE/api/status" | grep -q "\"version\":\"${IMAGE_TAG}\""
          }
          # The first deploy waits for Caddy to obtain the TLS certificate.
          for i in $(seq 1 40); do
            if check; then
              echo "Deployed ${IMAGE_TAG}: API, SPA, auth guard and status version are up"; exit 0
            fi
            sleep 3
          done
          echo "Health check failed"; ssh prod "cd ${APP_DIR} && docker compose ps && docker compose logs --tail 50"
          exit 1
