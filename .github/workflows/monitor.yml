name: Monitor

# Probes production every 30 minutes; a failed run makes GitHub email the workflow's owner.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Not read from the production environment: attaching it would record a deployment per run.
      SITE: https://43-161-240-115.sslip.io
    steps:
      - name: Health check
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 15 "$SITE/healthz"
      - name: Service status
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 20 "$SITE/api/status")
          echo "$body" | jq '{status, version, components: [.components[] | {name, status, latency_ms}], runs_24h}'
          status=$(echo "$body" | jq -r .status)
          if [ "$status" = "down" ]; then
            echo "::error::service status is down"
            exit 1
          fi
          if [ "$status" != "operational" ]; then
            echo "::warning::service status is $status"
          fi
      - name: SPA and public share page
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 15 "$SITE/" | grep -q '<div id="root">'
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors --max-time 15 -o /dev/null "$SITE/s/di8saYac"
